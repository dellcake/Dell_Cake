<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد | دل‌کیک</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fdf6f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 {
            font-family: 'Lalezar', cursive;
            font-size: 5rem;
            color: #e8789a;
            margin: 0;
        }
        h2 {
            color: #6b3d2a;
            margin-bottom: 20px;
        }
        p {
            color: #777;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #e8789a;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #d66185;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>۴۰۴</h1>
        <h2>اوپس! صفحه پیدا نشد</h2>
        <p>متاسفیم، صفحه‌ای که به دنبال آن بودید وجود ندارد یا جابجا شده است.</p>
        <a href="index.html" class="btn">بازگشت به خانه</a>
    </div>
</body>
</html>
