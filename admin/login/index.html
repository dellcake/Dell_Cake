<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت | دل‌کیک</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="floating-heart h1">❤</div>
    <div class="floating-heart h2">❤</div>
    <div class="floating-heart h3">❤</div>

    <div class="login-card">
        <div class="glass-reflection"></div>
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <img src="../../images/logo/sweet-.png" alt="Dell Cake" class="logo">
        </div>
        <div class="login-title">
            <h1>ورود مدیر</h1>
            <h2>پنل مدیریت دل‌کیک</h2>
            <p>دسترسی فقط برای مدیریت سایت امکان‌پذیر است.</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> ایمیل</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> رمز عبور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div class="forgot-link">
                <a href="forgot-password.html">رمز عبور را فراموش کرده‌اید؟</a>
            </div>
            <button type="submit" class="submit-btn">
                <span>ورود به پنل</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </form>

        <div class="login-divider">
            <span>یا ورود با</span>
        </div>

        <button id="googleLogin" class="google-btn">
            <img src="https://cdn.cdnlogo.com/logos/g/35/google-icon.svg" alt="Google">
            <span>حساب Google</span>
        </button>

        <div class="security-box">
            <div class="security-item">
                <i class="fa-solid fa-shield-halved"></i>
                <span>احراز هویت امن</span>
            </div>
            <div class="security-item">
                <i class="fa-solid fa-user-lock"></i>
                <span>دسترسی فقط مدیر</span>
            </div>
        </div>
    </div>

    <script type="module" src="../js/login.js"></script>
</body>
</html>
