<!-- ==========================================
        Dell Cake CMS Header
========================================== -->

<header class="admin-header">

    <!-- ==========================
            Left Section
    =========================== -->

    <div class="header-left">

        <!-- Mobile Toggle -->

        <button
            id="menuToggle"
            class="menu-toggle"
            aria-label="باز کردن منو">

            <i class="fa-solid fa-bars"></i>

        </button>

        <!-- Page Title -->

        <div class="page-title">

            <h1 id="pageTitle">

                داشبورد مدیریت

            </h1>

            <span id="pageSubtitle">

                Dell Cake Management System

            </span>

        </div>

    </div>

    <!-- ==========================
            Center Section
    =========================== -->

    <div class="header-center">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input

                id="globalSearch"

                type="search"

                autocomplete="off"

                spellcheck="false"

                placeholder="جستجو در سفارش‌ها، محصولات، کاربران ...">

        </div>

    </div>

    <!-- ==========================
            Right Section
    =========================== -->

    <div class="header-right">

        <!-- Persian Date -->

        <div class="header-date">

            <i class="fa-regular fa-calendar"></i>

            <span id="persianDate">

                -- / -- / ----

            </span>

        </div>

        <!-- Live Clock -->

        <div class="header-time">

            <i class="fa-regular fa-clock"></i>

            <span id="liveClock">

                00:00

            </span>

        </div>
                <!-- ==========================
                Notifications
        =========================== -->

        <button

            id="notificationBtn"

            class="header-icon notification-btn"

            aria-label="اعلان‌ها">

            <i class="fa-regular fa-bell"></i>

            <span

                id="notificationBadge"

                class="notification-badge">

                0

            </span>

        </button>


        <!-- ==========================
                Admin Profile
        =========================== -->

        <div

            id="adminProfile"

            class="admin-profile">

            <!-- Avatar -->

            <div class="profile-image">

                <img

                    id="adminAvatar"

                    src="../images/logo/sweet-.png"

                    alt="Admin">

                <span class="online-status"></span>

            </div>


            <!-- Profile Info -->

            <div class="profile-info">

                <h4 id="adminName">

                    در حال بارگذاری...

                </h4>

                <span id="adminRole">

                    مدیر سیستم

                </span>

            </div>


            <!-- Dropdown Arrow -->

            <i class="fa-solid fa-chevron-down"></i>

        </div>

    </div>

<!-- ==========================================
        Profile Dropdown
========================================== -->

<div

    id="profileDropdown"

    class="profile-dropdown">

    <!-- Profile Header -->

    <div class="dropdown-profile">

        <img

            id="dropdownAvatar"

            src="../images/logo/sweet-.png"

            alt="Admin">

        <div>

            <h4 id="dropdownName">

                در حال بارگذاری...

            </h4>

            <span id="dropdownEmail">

                loading...

            </span>

        </div>

    </div>

    <div class="dropdown-divider"></div>

    <!-- Profile -->

    <a href="profile/index.html">

        <i class="fa-regular fa-user"></i>

        <span>

            پروفایل مدیر

        </span>

    </a>

    <!-- Settings -->

    <a href="settings/index.html">

        <i class="fa-solid fa-gear"></i>

        <span>

            تنظیمات پنل

        </span>

    </a>

    <!-- Security -->

    <a href="security/index.html">

        <i class="fa-solid fa-shield-halved"></i>

        <span>

            امنیت حساب

        </span>

    </a>

    <!-- Logs -->

    <a href="logs/index.html">

        <i class="fa-solid fa-clock-rotate-left"></i>

        <span>

            گزارش فعالیت‌ها

        </span>

    </a>

    <div class="dropdown-divider"></div>

    <!-- Logout -->

    <button

        id="logoutBtn"

        type="button">

        <i class="fa-solid fa-right-from-bracket"></i>

        <span>

            خروج از حساب

        </span>

    </button>

</div>



<!-- ==========================================
        Notification Panel
========================================== -->

<div

    id="notificationPanel"

    class="notification-panel">

    <div class="panel-header">

        <h3>

            اعلان‌ها

        </h3>

        <button

            id="clearNotifications"

            type="button">

            پاک کردن همه

        </button>

    </div>

    <div

        id="notificationList"

        class="notification-list">

        <div class="empty-notification">

            <i class="fa-regular fa-bell-slash"></i>

            <span>

                اعلان جدیدی وجود ندارد.

            </span>

        </div>

    </div>

</div>

<!-- ==========================================
        Search Result Box
========================================== -->

<div

    id="searchResultBox"

    class="search-result-box">

    <div class="search-result-header">

        <span>

            نتایج جستجو

        </span>

    </div>

    <div

        id="searchResults"

        class="search-results">

        <div class="search-empty">

            <i class="fa-solid fa-magnifying-glass"></i>

            <span>

                برای جستجو عبارت موردنظر را تایپ کنید...

            </span>

        </div>

    </div>

</div>

</header>
