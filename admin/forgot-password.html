<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور | دل‌کیک</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>

    <div class="login-card">
        <div class="glass-reflection"></div>
        <div class="logo-wrapper">
            <img src="../images/logo/sweet-.png" alt="Dell Cake" class="logo">
        </div>
        <div class="login-title">
            <h1>بازیابی رمز عبور</h1>
            <p>ایمیل خود را وارد کنید تا لینک بازیابی ارسال شود.</p>
        </div>

        <form id="forgotForm" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> ایمیل</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <button type="submit" class="submit-btn">
                <span>ارسال لینک بازیابی</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <div class="back-to-login">
            <a href="login.html"><i class="fa-solid fa-arrow-right"></i> بازگشت به صفحه ورود</a>
        </div>
    </div>

    <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
