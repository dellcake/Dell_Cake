<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت دل‌کیک</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Vazirmatn',sans-serif;
}

body{
    background:#fff7fa;
    padding:30px;
}

.panel{
    max-width:900px;
    margin:auto;
}

.title{
    text-align:center;
    color:#f01873;
    margin-bottom:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:24px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.card h3{
    color:#f01873;
    margin-bottom:10px;
}

.card p{
    color:#666;
    line-height:1.8;
}
</style>
</head>

<body>

<div class="panel">

<h1 class="title">
🎂 پنل مدیریت دل‌کیک
</h1>

<div class="cards">

<div class="card">
<h3>دوره‌های آموزشی</h3>
<p>مدیریت دوره‌ها</p>
</div>

<div class="card">
<h3>گالری</h3>
<p>مدیریت تصاویر</p>
</div>

<div class="card">
<h3>محتوای سایت</h3>
<p>ویرایش متن‌ها</p>
</div>

<div class="card">
<h3>سفارش‌ها</h3>
<p>مدیریت سفارش‌ها</p>
</div>

</div>

</div>

</body>
</html>
