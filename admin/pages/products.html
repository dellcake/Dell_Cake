<div class="content-section">
    <div class="section-header">
        <div class="header-left">
            <h2><i class="fas fa-cake-candles"></i> مدیریت محصولات</h2>
            <p>سفارش کیک‌های تولد، شیرینی و دسرهای خانگی</p>
        </div>
        <div class="header-right">
            <button class="btn btn-primary" onclick="openProductModal()">
                <i class="fas fa-plus"></i> محصول جدید
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>تصویر</th>
                        <th>نام محصول</th>
                        <th>قیمت پایه</th>
                        <th>دسته‌بندی</th>
                        <th>وضعیت</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="products-tbody">
                    <!-- Loaded by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="product-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>مدیریت محصول</h3>
            <span class="close" onclick="closeProductModal()">&times;</span>
        </div>
        <form id="product-form" onsubmit="saveProduct(event)">
            <input type="hidden" name="productId">
            <div class="modal-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>نام محصول</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>دسته‌بندی</label>
                        <select name="category" class="form-control">
                            <option value="cake">کیک</option>
                            <option value="pastry">شیرینی</option>
                            <option value="dessert">دسر</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>قیمت پایه (تومان)</label>
                        <input type="number" name="price" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>وضعیت</label>
                        <select name="status" class="form-control">
                            <option value="active">فعال</option>
                            <option value="inactive">غیرفعال</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>توضیحات</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>تصویر محصول</label>
                    <input type="file" id="product-image-input" class="form-control" accept="image/*" onchange="previewProductImage(event)">
                    <div id="product-preview" style="margin-top: 10px; height: 120px; border: 2px dashed var(--border-color); border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                        <span>انتخاب تصویر</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeProductModal()">انصراف</button>
                <button type="submit" class="btn btn-primary" id="save-product-btn">ذخیره محصول</button>
            </div>
        </form>
    </div>
</div>
