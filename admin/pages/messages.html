<div class="content-section">
    <div class="section-header">
        <div class="header-left">
            <h2><i class="fas fa-envelope"></i> پیام‌های دریافتی</h2>
            <p>مشاهده پیام‌های ارسال شده از طریق فرم تماس با ما</p>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 25px;">
        <!-- Messages List -->
        <div class="card" style="padding: 0; overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 200px);">
            <div style="padding: 15px; border-bottom: 1px solid var(--border-color);">
                <select class="form-control" id="filter-message-status" onchange="handleMessageFilter()">
                    <option value="all">همه پیام‌ها</option>
                    <option value="unread">خوانده نشده</option>
                    <option value="read">خوانده شده</option>
                    <option value="replied">پاسخ داده شده</option>
                </select>
            </div>
            <div id="messages-list" style="overflow-y: auto; flex: 1;">
                <!-- Loaded by JS -->
            </div>
        </div>

        <!-- Message View (Hidden initially) -->
        <div id="message-detail-view" class="card" style="display: none;">
            <!-- Content will be injected here -->
        </div>

        <div id="message-placeholder" class="card" style="display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
            <div style="text-align: center;">
                <i class="fas fa-envelope-open" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
                <p>برای مشاهده محتوا، یک پیام را انتخاب کنید</p>
            </div>
        </div>
    </div>
</div>

<!-- Simple Modal for mobile/detailed view if needed -->
<div id="message-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>جزئیات پیام</h3>
            <span class="close" onclick="closeMessageModal()">&times;</span>
        </div>
        <div class="modal-body" id="message-detail-content">
            <!-- Loaded by JS -->
        </div>
        <div class="modal-footer" style="justify-content: space-between;">
            <button class="btn btn-danger" onclick="deleteCurrentMessage()">حذف پیام</button>
            <div style="display: flex; gap: 10px;">
                <select class="form-control" id="update-message-status" onchange="updateCurrentMessageStatus(this.value)" style="width: auto;">
                    <option value="unread">خوانده نشده</option>
                    <option value="read">خوانده شده</option>
                    <option value="replied">پاسخ داده شده</option>
                </select>
                <button class="btn btn-primary" onclick="closeMessageModal()">بستن</button>
            </div>
        </div>
    </div>
</div>

<style>
.message-card {
    padding: 15px;
    border-bottom: 1px solid var(--border-color);
    cursor: pointer;
    transition: background 0.3s;
    border-right: 4px solid transparent;
}
.message-card:hover {
    background: rgba(255,255,255,0.05);
}
.message-card.unread {
    background: rgba(232, 120, 154, 0.05);
    border-right-color: var(--primary);
}
.message-card h4 {
    font-size: 0.9rem;
    margin-bottom: 5px;
    color: var(--white);
}
.message-card p {
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.msg-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 0.7rem;
}
</style>
