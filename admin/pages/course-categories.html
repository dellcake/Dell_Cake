<div class="content-section">
    <div class="section-header">
        <div class="header-left">
            <h2><i class="fas fa-list-ul"></i> دسته‌بندی دوره‌ها</h2>
            <p>مدیریت دسته‌بندی‌های آکادمی دل‌کیک</p>
        </div>
        <div class="header-right">
            <button class="btn btn-primary" onclick="resetCourseCategoryForm()">
                <i class="fas fa-plus"></i> دسته جدید
            </button>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 350px; gap: 25px;">
        <!-- List -->
        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;">ترتیب</th>
                            <th>نام دسته</th>
                            <th>نام مستعار (Slug)</th>
                            <th>وضعیت</th>
                            <th style="width: 100px;">عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="course-categories-grid">
                        <!-- Loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Form -->
        <div class="card">
            <h3 id="course-category-form-title" style="margin-bottom: 20px; color: var(--secondary);"><i class="fas fa-plus"></i> دسته جدید</h3>
            <form id="course-category-form" onsubmit="handleCourseCategorySave(event)">
                <input type="hidden" id="course-cat-id">

                <div class="form-group">
                    <label>نام دسته‌بندی</label>
                    <input type="text" id="course-cat-name" class="form-control" placeholder="مثلاً: کیک تولد" required>
                </div>

                <div class="form-group">
                    <label>نام مستعار (URL Slug)</label>
                    <input type="text" id="course-cat-slug" class="form-control" placeholder="birthday-cakes" required>
                </div>

                <div class="form-group">
                    <label>ترتیب نمایش</label>
                    <input type="number" id="course-cat-order" class="form-control" value="0">
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="course-cat-active" checked>
                        <span>این دسته‌بندی فعال باشد</span>
                    </label>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">ذخیره اطلاعات</button>
                    <button type="button" class="btn btn-outline" onclick="resetCourseCategoryForm()">انصراف</button>
                </div>
            </form>
        </div>
    </div>
</div>
