<section class="content-section">
    <div class="section-header">
        <h2>مدیریت سفارشات</h2>
        <div class="header-actions">
            <button class="btn-secondary" onclick="exportOrdersToCSV()">
                <i class="fa-solid fa-file-export"></i>
                خروجی CSV
            </button>
        </div>
    </div>

    <!-- Filters & Search -->
    <div class="card filters-card">
        <div class="filter-row">
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="order-search" placeholder="جستجوی شماره سفارش یا نام مشتری..." oninput="handleOrderSearch(this.value)">
            </div>
            <div class="filter-group">
                <select id="filter-order-status" onchange="handleOrderFilter()">
                    <option value="all">همه وضعیت‌ها</option>
                    <option value="new">جدید</option>
                    <option value="pending">در حال بررسی</option>
                    <option value="preparing">در حال آماده‌سازی</option>
                    <option value="ready">آماده تحویل</option>
                    <option value="completed">تحویل داده شده</option>
                    <option value="cancelled">لغو شده</option>
                </select>
                <select id="sort-orders" onchange="handleOrderFilter()">
                    <option value="newest">جدیدترین</option>
                    <option value="oldest">قدیمی‌ترین</option>
                    <option value="price-high">بیشترین قیمت</option>
                    <option value="price-low">کمترین قیمت</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Orders Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>شماره سفارش</th>
                    <th>نام مشتری</th>
                    <th>محصول/دوره</th>
                    <th>مبلغ (تومان)</th>
                    <th>تاریخ ثبت</th>
                    <th>وضعیت</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="orders-tbody">
                <tr><td colspan="7" style="text-align:center">در حال بارگذاری...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-container">
        <div class="pagination-info">
            نمایش <span id="order-page-start">0</span> تا <span id="order-page-end">0</span> از <span id="order-total-items">0</span> سفارش
        </div>
        <div class="pagination-controls">
            <button class="page-btn" id="order-prev-page" onclick="changeOrderPage(-1)"><i class="fa-solid fa-chevron-right"></i></button>
            <span id="order-current-page">۱</span>
            <button class="page-btn" id="order-next-page" onclick="changeOrderPage(1)"><i class="fa-solid fa-chevron-left"></i></button>
        </div>
    </div>
</section>

<!-- Order Details Modal -->
<div id="order-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="order-modal-title">جزئیات سفارش</h2>
            <span class="close" onclick="closeOrderModal()">&times;</span>
        </div>
        <div id="order-details-content" class="order-details-grid">
            <!-- Dynamic Content -->
        </div>
        <div class="modal-footer">
            <button class="cancel-btn" onclick="closeOrderModal()">بستن</button>
            <button class="add-btn" onclick="printOrder()">
                <i class="fa-solid fa-print"></i>
                چاپ فاکتور
            </button>
        </div>
    </div>
</div>

<style>
.order-details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
}
.detail-item {
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.detail-item label {
    font-size: 0.8rem;
    color: var(--text-light);
}
.detail-item span {
    font-weight: 600;
    color: var(--secondary);
}
.order-full-width {
    grid-column: span 2;
    background: var(--accent);
    padding: 15px;
    border-radius: 10px;
}
.header-actions {
    display: flex;
    gap: 10px;
}
.btn-secondary {
    background-color: var(--secondary);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
    font-weight: 600;
    transition: opacity 0.3s;
}
.btn-secondary:hover { opacity: 0.9; }

@media print {
    body * { visibility: hidden; }
    #order-modal, #order-modal * { visibility: visible; }
    #order-modal { position: absolute; left: 0; top: 0; width: 100%; }
    .modal-footer, .close { display: none; }
}
</style>
