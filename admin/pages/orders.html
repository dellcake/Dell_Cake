<div class="content-section">
    <div class="section-header">
        <div class="header-left">
            <h2><i class="fas fa-shopping-cart"></i> مدیریت سفارش‌ها</h2>
            <p>مشاهده و مدیریت وضعیت سفارشات مشتریان</p>
        </div>
        <div class="header-right">
            <button class="btn btn-outline" onclick="exportOrdersToCSV()">
                <i class="fas fa-download"></i> خروجی اکسل
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card" style="margin-bottom: 25px;">
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                <input type="text" class="form-control" placeholder="جستجو (نام مشتری، شناسه، محصول...)" oninput="handleOrderSearch(this.value)">
            </div>
            <div class="form-group" style="width: 180px; margin-bottom: 0;">
                <select class="form-control" id="filter-order-status" onchange="handleOrderFilter()">
                    <option value="all">همه وضعیت‌ها</option>
                    <option value="new">جدید</option>
                    <option value="pending">در حال بررسی</option>
                    <option value="preparing">آماده‌سازی</option>
                    <option value="ready">آماده تحویل</option>
                    <option value="completed">تکمیل شده</option>
                    <option value="cancelled">لغو شده</option>
                </select>
            </div>
            <div class="form-group" style="width: 180px; margin-bottom: 0;">
                <select class="form-control" id="sort-orders" onchange="handleOrderFilter()">
                    <option value="newest">جدیدترین</option>
                    <option value="oldest">قدیمی‌ترین</option>
                    <option value="price-high">بیشترین قیمت</option>
                    <option value="price-low">کمترین قیمت</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Orders Table -->
    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>شناسه</th>
                        <th>مشتری</th>
                        <th>نوع سفارش</th>
                        <th>تاریخ ثبت</th>
                        <th>تاریخ تحویل</th>
                        <th>وضعیت</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <!-- Loaded by JS -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
            <div style="font-size: 0.85rem; color: var(--text-muted);">
                نمایش <span id="order-page-start">۰</span> تا <span id="order-page-end">۰</span> از <span id="order-total-items">۰</span> سفارش
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="btn btn-outline btn-sm" id="prev-page" onclick="changeOrderPage(-1)">قبلی</button>
                <span id="order-current-page" style="font-weight: bold; min-width: 30px; text-align: center;">۱</span>
                <button class="btn btn-outline btn-sm" id="next-page" onclick="changeOrderPage(1)">بعدی</button>
            </div>
        </div>
    </div>
</div>

<!-- Order Detail Modal -->
<div id="order-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>جزئیات سفارش</h3>
            <span class="close" onclick="closeOrderModal()">&times;</span>
        </div>
        <div class="modal-body" id="order-details-content" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- Loaded by JS -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="printOrder()">
                <i class="fas fa-print"></i> چاپ فاکتور
            </button>
            <button class="btn btn-primary" onclick="closeOrderModal()">بستن</button>
        </div>
    </div>
</div>
