<div class="content-section">
    <div class="section-header">
        <div class="header-left">
            <h2><i class="fas fa-tags"></i> مدیریت تخفیف‌ها</h2>
            <p>ایجاد کد تخفیف برای دوره‌ها و محصولات</p>
        </div>
        <div class="header-right">
            <button class="btn btn-primary" onclick="openDiscountModal()">
                <i class="fas fa-plus"></i> کد جدید
            </button>
        </div>
    </div>

    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>کد تخفیف</th>
                        <th>مقدار</th>
                        <th>نوع</th>
                        <th>محدودیت استفاده</th>
                        <th>تعداد استفاده شده</th>
                        <th>وضعیت</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="discounts-tbody">
                    <!-- Loaded by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="discount-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>افزودن کد تخفیف</h3>
            <span class="close" onclick="closeDiscountModal()">&times;</span>
        </div>
        <form id="discount-form" onsubmit="saveDiscount(event)">
            <input type="hidden" name="discountId">
            <div class="modal-body">
                <div class="form-group">
                    <label>کد تخفیف (مثال: CAKE1403)</label>
                    <input type="text" name="code" class="form-control" required dir="ltr">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>مقدار تخفیف</label>
                        <input type="number" name="amount" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>نوع تخفیف</label>
                        <select name="type" class="form-control">
                            <option value="percentage">درصدی</option>
                            <option value="fixed">مبلغ ثابت (تومان)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>محدودیت تعداد کل استفاده</label>
                    <input type="number" name="limit" class="form-control" placeholder="بدون محدودیت">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>تاریخ شروع</label>
                        <input type="date" name="startDate" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>تاریخ انقضا</label>
                        <input type="date" name="endDate" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label>وضعیت</label>
                    <select name="status" class="form-control">
                        <option value="active">فعال</option>
                        <option value="inactive">غیرفعال</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeDiscountModal()">انصراف</button>
                <button type="submit" class="btn btn-primary" id="save-discount-btn">ذخیره کد</button>
            </div>
        </form>
    </div>
</div>
