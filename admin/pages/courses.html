<section class="content-section">
    <div class="section-header">
        <h2>مدیریت دوره‌های آموزشی</h2>
        <button class="add-btn" onclick="openCourseModal()">
            <i class="fa-solid fa-plus"></i> افزودن دوره جدید
        </button>
    </div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>تصویر</th>
                    <th>عنوان دوره</th>
                    <th>قیمت (تومان)</th>
                    <th>سطح</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="courses-tbody">
                <tr><td colspan="5" style="text-align:center">در حال بارگذاری...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Course Modal -->
    <div id="course-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">افزودن دوره جدید</h3>
                <span class="close" onclick="closeCourseModal()">&times;</span>
            </div>
            <form id="course-form" onsubmit="saveCourse(event)">
                <input type="hidden" name="courseId">
                <div class="form-grid">
                <div class="form-group">
                    <label>عنوان دوره</label>
                    <input type="text" name="title" required>
                </div>
                <div class="form-group">
                    <label>قیمت (تومان)</label>
                    <input type="number" name="price" required>
                </div>
                <div class="form-group">
                    <label>سطح</label>
                    <select name="level">
                        <option value="beginner">مبتدی</option>
                        <option value="intermediate" selected>متوسط</option>
                        <option value="advanced">پیشرفته</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>URL تصویر</label>
                    <input type="text" name="image">
                </div>
                <div class="form-group full-width">
                    <label>محتوای پکیج (هر مورد در یک خط)</label>
                    <textarea name="packageContent" rows="5"></textarea>
                </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="cancel-btn" onclick="closeCourseModal()">انصراف</button>
                    <button type="submit" class="save-btn">ذخیره دوره</button>
                </div>
            </form>
        </div>
    </div>
</section>
