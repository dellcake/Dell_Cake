<section class="content-section">
    <div class="section-header">
        <h2>مدیریت گالری تصاویر</h2>
        <p class="section-subtitle">تصاویر محصولات و نمونه کارهای خود را مدیریت کنید. (واترمارک به صورت خودکار اعمال می‌شود)</p>
    </div>

    <!-- Upload Section -->
    <div class="card upload-card">
        <div class="upload-container">
            <div class="upload-box" onclick="document.getElementById('gallery-file-input').click()">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>برای انتخاب تصویر کلیک کنید یا تصویر را به اینجا بکشید</p>
                <input type="file" id="gallery-file-input" hidden accept="image/*" onchange="previewGalleryImage(event)">
            </div>
            <div id="gallery-preview-container" class="gallery-preview-box" style="display: none;">
                <img id="gallery-upload-preview" src="" alt="Preview">
                <button class="btn-remove-preview" onclick="clearGalleryPreview()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="upload-info">
                <div class="form-group">
                    <label>دسته بندی:</label>
                    <select id="gallery-upload-category">
                        <option value="cake">کیک</option>
                        <option value="pastry">شیرینی</option>
                        <option value="cafe-cake">کیک‌های کافه‌ای</option>
                        <option value="cupcake">کاپ کیک</option>
                        <option value="other">سایر</option>
                    </select>
                </div>
                <button id="upload-gallery-btn" class="add-btn" onclick="handleGalleryUpload()">
                    <i class="fa-solid fa-upload"></i>
                    آپلود تصویر
                </button>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="gallery-filters">
        <button class="filter-btn active" onclick="filterGallery('all')">همه</button>
        <button class="filter-btn" onclick="filterGallery('cake')">کیک</button>
        <button class="filter-btn" onclick="filterGallery('pastry')">شیرینی</button>
        <button class="filter-btn" onclick="filterGallery('cafe-cake')">کیک‌های کافه‌ای</button>
        <button class="filter-btn" onclick="filterGallery('cupcake')">کاپ کیک</button>
    </div>

    <!-- Gallery Grid -->
    <div id="gallery-grid" class="gallery-grid">
        <!-- Images will be loaded here -->
        <div class="loader-wrapper"><div class="loader"></div></div>
    </div>
</section>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close-lightbox">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
    <div id="lightbox-caption"></div>
</div>
