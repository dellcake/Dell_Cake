<div class="content-section">
    <div class="section-header">
        <div class="header-left">
            <h2><i class="fas fa-images"></i> مدیریت گالری</h2>
            <p>تصاویر نمونه کارها با واترمارک خودکار "دل‌کیک"</p>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 25px;">
        <!-- Upload Card -->
        <div class="card" style="height: fit-content;">
            <div class="card-header">
                <h2><i class="fas fa-upload"></i> آپلود تصویر جدید</h2>
            </div>
            <div class="form-group">
                <label>انتخاب فایل</label>
                <input type="file" id="gallery-file-input" class="form-control" accept="image/*" onchange="previewGalleryImage(event)">
            </div>
            <div class="form-group">
                <label>دسته‌بندی</label>
                <select id="gallery-upload-category" class="form-control">
                    <option value="cake">کیک</option>
                    <option value="pastry">شیرینی</option>
                    <option value="cafe-cake">کیک کافه‌ای</option>
                    <option value="cupcake">کاپ کیک</option>
                    <option value="other">سایر</option>
                </select>
            </div>

            <div id="gallery-preview-container" style="display: none; margin-bottom: 20px;">
                <p style="font-size: 0.8rem; margin-bottom: 5px; color: var(--text-muted);">پیش‌نمایش (واترمارک هنگام آپلود اعمال می‌شود):</p>
                <img id="gallery-upload-preview" style="width: 100%; border-radius: 10px; border: 1px solid var(--border-color);">
            </div>

            <button class="btn btn-primary" style="width: 100%;" id="upload-gallery-btn" onclick="handleGalleryUpload()">
                <i class="fas fa-upload"></i> آپلود تصویر
            </button>
        </div>

        <!-- Gallery Grid -->
        <div class="card">
            <div class="card-header">
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn btn-outline btn-sm filter-btn active" onclick="filterGallery('all')">همه</button>
                    <button class="btn btn-outline btn-sm filter-btn" onclick="filterGallery('cake')">کیک</button>
                    <button class="btn btn-outline btn-sm filter-btn" onclick="filterGallery('pastry')">شیرینی</button>
                    <button class="btn btn-outline btn-sm filter-btn" onclick="filterGallery('cafe-cake')">کیک کافه‌ای</button>
                    <button class="btn btn-outline btn-sm filter-btn" onclick="filterGallery('cupcake')">کاپ کیک</button>
                </div>
            </div>

            <div id="gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px;">
                <!-- Loaded by JS -->
            </div>
        </div>
    </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="modal" onclick="closeLightbox()">
    <div style="max-width: 90%; max-height: 90%; position: relative;">
        <img id="lightbox-img" style="max-width: 100%; max-height: 100vh; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5);">
        <p id="lightbox-caption" style="text-align: center; color: white; margin-top: 10px; font-weight: bold;"></p>
    </div>
</div>

<style>
.gallery-item {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 1;
    cursor: pointer;
    border: 1px solid var(--border-color);
}
.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
}
.gallery-item:hover img {
    transform: scale(1.1);
}
.gallery-item-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
}
.gallery-item:hover .gallery-item-overlay {
    opacity: 1;
}
.category-badge {
    position: absolute;
    top: 5px;
    right: 5px;
    background: var(--primary);
    color: white;
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 4px;
    z-index: 2;
}
.btn-delete-image {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.8rem;
}
</style>
