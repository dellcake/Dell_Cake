<div class="content-section">
    <div class="section-header">
        <div class="header-left">
            <h2><i class="fas fa-images"></i> مدیریت گالری</h2>
            <p>کنترل کامل بر تصاویر، دسته‌بندی‌ها و واترمارک خودکار</p>
        </div>
        <button class="add-btn" onclick="openGalleryModal()">
            <i class="fas fa-plus"></i> افزودن تصویر جدید
        </button>
    </div>

    <!-- Stats & Filters -->
    <div class="card" style="margin-bottom: 25px;">
        <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
            <div class="form-group" style="margin: 0; min-width: 200px;">
                <input type="text" id="gallery-search" class="form-control" placeholder="جستجو در کد، عنوان یا توضیحات..." oninput="handleGallerySearch(this.value)">
            </div>
            <div class="form-group" style="margin: 0; min-width: 180px;">
                <select id="gallery-category-filter" class="form-control" onchange="handleGalleryCategoryFilter(this.value)">
                    <option value="all">همه دسته‌ها</option>
                </select>
            </div>
            <div style="margin-right: auto; display: flex; gap: 10px;">
                <span class="status-badge new" id="total-gallery-count">تعداد: ۰</span>
            </div>
        </div>
    </div>

    <!-- Gallery Grid -->
    <div id="gallery-grid" class="gallery-management-grid">
        <!-- Loaded by JS -->
    </div>
</div>

<!-- Gallery Upload/Edit Modal -->
<div id="gallery-modal" class="modal">
    <div class="modal-content" style="max-width: 800px;">
        <div class="modal-header">
            <h2 id="gallery-modal-title">افزودن تصویر به گالری</h2>
            <span class="close" onclick="closeGalleryModal()">&times;</span>
        </div>
        <form id="gallery-form" onsubmit="handleGallerySave(event)">
            <input type="hidden" id="gallery-id">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div class="left-col">
                    <div class="form-group">
                        <label>آپلود تصویر (Drag & Drop)</label>
                        <div id="gallery-drop-zone" class="drop-zone">
                            <span class="drop-zone__prompt">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <span>فایل را اینجا رها کنید یا کلیک کنید</span>
                            </span>
                            <input type="file" name="galleryFile" id="gallery-file-input" class="drop-zone__input" accept="image/*">
                        </div>
                        <input type="hidden" id="gallery-image-url">
                        <input type="hidden" id="gallery-thumb-url">
                    </div>

                    <div class="form-group">
                        <label>پیش‌نمایش تصویر</label>
                        <div class="image-preview-container">
                            <img id="gallery-preview" src="../images/logo/sweet-.png" style="width: 100%; height: 200px; object-fit: contain; border-radius: 12px; background: #f8f9fa; border: 1px solid var(--border-color);">
                        </div>
                    </div>
                </div>
                <div class="right-col">
                    <div class="form-group" id="gallery-code-group" style="display: none;">
                        <label>کد اختصاصی تصویر</label>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <input type="text" id="gallery-code" class="form-control" readonly style="background: #e9ecef; cursor: not-allowed; font-weight: bold; flex: 1;">
                            <button type="button" class="btn btn-outline" onclick="copyGalleryCodeFromModal()" style="padding: 10px 15px;" title="کپی کد"><i class="fas fa-copy"></i> کپی</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>عنوان تصویر</label>
                        <input type="text" id="gallery-title" class="form-control" placeholder="مثلاً: کیک تولد شکلاتی">
                    </div>
                    <div class="form-group">
                        <label>دسته‌بندی</label>
                        <select id="gallery-modal-category" class="form-control" required>
                            <option value="">در حال بارگذاری...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>متن جایگزین (Alt Text)</label>
                        <input type="text" id="gallery-alt" class="form-control" placeholder="برای سئو بهتر">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>وضعیت انتشار</label>
                            <select id="gallery-status" class="form-control">
                                <option value="published">منتشر شده</option>
                                <option value="draft">پیش‌نویس</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>توضیحات</label>
                <textarea id="gallery-description" class="form-control" rows="3"></textarea>
            </div>

            <div style="display: flex; gap: 20px; background: var(--accent); padding: 15px; border-radius: 12px; margin-top: 10px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="gallery-is-featured-modal" style="width: 18px; height: 18px;">
                    <label for="gallery-is-featured-modal" style="margin: 0;">ستاره‌دار (اسلایدر اصلی)</label>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="gallery-watermark" style="width: 18px; height: 18px;" checked>
                    <label for="gallery-watermark" style="margin: 0;">فعال‌سازی واترمارک</label>
                </div>
            </div>

            <div class="modal-footer" style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="btn btn-outline" onclick="closeGalleryModal()">انصراف</button>
                <button type="submit" class="btn btn-primary" id="save-gallery-btn">
                    <i class="fas fa-save"></i> ذخیره در گالری
                </button>
            </div>
        </form>
    </div>
</div>

<style>
.gallery-management-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
}
.gallery-admin-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    border: 1px solid var(--border-color);
}
.gallery-admin-card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-lg);
    border-color: var(--primary-light);
}
.gallery-card-img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    border-bottom: 1px solid var(--border-color);
}
.gallery-card-info {
    padding: 16px;
}
.gallery-card-info h4 {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.gallery-card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
}
.featured-star {
    position: absolute;
    top: 12px;
    right: 12px;
    color: #f1c40f;
    background: white;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    box-shadow: var(--shadow-sm);
    z-index: 2;
}
.image-preview-container {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    transition: all 0.3s ease;
}
.image-preview-container:hover {
    box-shadow: var(--pink-glow);
}
</style>
