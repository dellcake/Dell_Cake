<div class="content-section">
    <div class="section-header">
        <div class="header-left">
            <h2><i class="fas fa-ad"></i> مدیریت بنرها</h2>
            <p>مدیریت اسلایدر و بنرهای تبلیغاتی صفحه اصلی</p>
        </div>
        <div class="header-right">
            <button class="btn btn-primary" onclick="openBannerModal()">
                <i class="fas fa-plus"></i> بنر جدید
            </button>
        </div>
    </div>

    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>تصویر</th>
                        <th>عنوان</th>
                        <th>لینک</th>
                        <th>اولویت</th>
                        <th>وضعیت</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="banners-tbody">
                    <!-- Loaded by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="banner-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>افزودن بنر</h3>
            <span class="close" onclick="closeBannerModal()">&times;</span>
        </div>
        <form id="banner-form" onsubmit="saveBanner(event)">
            <input type="hidden" name="bannerId">
            <div class="modal-body">
                <div class="form-group">
                    <label>عنوان بنر</label>
                    <input type="text" name="title" class="form-control">
                </div>
                <div class="form-group">
                    <label>لینک مقصد (URL)</label>
                    <input type="text" name="link" class="form-control" dir="ltr">
                </div>
                <div class="form-group">
                    <label>اولویت نمایش (عدد بزرگتر = نمایش زودتر)</label>
                    <input type="number" name="priority" class="form-control" value="0">
                </div>
                <div class="form-group">
                    <label>وضعیت</label>
                    <select name="status" class="form-control">
                        <option value="active">فعال</option>
                        <option value="inactive">غیرفعال</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>تصویر بنر</label>
                    <input type="file" id="banner-image-input" class="form-control" accept="image/*" onchange="previewBannerImage(event)">
                    <div id="banner-preview" style="margin-top: 10px; height: 120px; border: 2px dashed var(--border-color); border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                        <span>انتخاب تصویر</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeBannerModal()">انصراف</button>
                <button type="submit" class="btn btn-primary" id="save-banner-btn">ذخیره بنر</button>
            </div>
        </form>
    </div>
</div>
