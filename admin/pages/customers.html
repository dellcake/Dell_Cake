<div class="content-section">
    <div class="section-header">
        <div class="header-left">
            <h2><i class="fas fa-users"></i> مدیریت کاربران</h2>
            <p>لیست کاربران و مشتریان ثبت نام شده در سایت</p>
        </div>
        <div class="header-right">
            <button class="btn btn-outline" onclick="exportCustomersToCSV()">
                <i class="fas fa-file-csv"></i> خروجی CSV
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card" style="margin-bottom: 25px;">
        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <input type="text" class="form-control" placeholder="جستجوی نام، ایمیل یا تلفن..." oninput="handleCustomerSearch(this.value)">
            </div>
            <div class="form-group" style="width: 200px; margin-bottom: 0;">
                <select class="form-control" id="filter-customer-status" onchange="handleCustomerFilter()">
                    <option value="all">همه وضعیت‌ها</option>
                    <option value="active">فعال</option>
                    <option value="inactive">غیرفعال</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>نام کاربر</th>
                        <th>ایمیل</th>
                        <th>شماره تماس</th>
                        <th>تاریخ عضویت</th>
                        <th>وضعیت</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="customers-tbody">
                    <!-- Loaded by JS -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <div style="font-size: 0.85rem; color: var(--text-muted);">
                نمایش <span id="customer-page-start">۰</span> تا <span id="customer-page-end">۰</span> از <span id="customer-total-items">۰</span> کاربر
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline btn-sm" id="customer-prev-page" onclick="changeCustomerPage(-1)">قبلی</button>
                <span id="customer-current-page" style="font-weight: bold; min-width: 30px; text-align: center;">۱</span>
                <button class="btn btn-outline btn-sm" id="customer-next-page" onclick="changeCustomerPage(1)">بعدی</button>
            </div>
        </div>
    </div>
</div>
