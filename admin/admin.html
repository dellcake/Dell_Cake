<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>پنل مدیریت — دل‌کیک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Lalezar&display=swap" rel="stylesheet"/>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#e8789a;--pink-d:#c4556f;--pink-l:#fce8ef;--pink-2:#f9d0df;
  --cream:#fdf6f0;--brown:#6b3d2a;--brown-l:#a07060;
  --green:#10b981;--green-bg:#ecfdf5;
  --yellow:#f59e0b;--yellow-bg:#fffbeb;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --red:#ef4444;--red-bg:#fef2f2;
  --ink:#1e293b;--ink-s:#475569;--ink-f:#94a3b8;
  --surface:#f8fafc;--border:#e2e8f0;
  --white:#ffffff;
  --r-sm:12px;--r-md:18px;--r-lg:24px;--r-xl:28px;
  --sh-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --sh-lg:0 20px 48px rgba(0,0,0,.10),0 4px 12px rgba(0,0,0,.06);
  --sh-pink:0 8px 24px rgba(228,120,154,.22);
}
body{font-family:'Vazirmatn',sans-serif;background:var(--surface);color:var(--ink);min-height:100svh;overflow-x:hidden}

/* ── AMBIENT ── */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(155deg,#fff8fb 0%,#fdf0f5 40%,#f8f4ff 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 12s ease-in-out infinite}
.orb1{width:480px;height:480px;top:-140px;right:-100px;background:radial-gradient(circle,rgba(232,120,154,.35),transparent 70%)}
.orb2{width:380px;height:380px;bottom:-100px;left:-80px;background:radial-gradient(circle,rgba(196,85,111,.22),transparent 70%);animation-delay:-4s}
.orb3{width:300px;height:300px;top:45%;left:38%;background:radial-gradient(circle,rgba(124,58,237,.15),transparent 70%);animation-delay:-7s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14px,18px) scale(1.04)}}

/* ── LAYOUT ── */
.app{display:flex;min-height:100svh;position:relative;z-index:1;max-width:1600px;margin:auto;padding:1rem;gap:1.25rem}
@media(max-width:1023px){.app{flex-direction:column;padding:.75rem;gap:.75rem}}

/* ── PANEL BASE ── */
.panel{background:rgba(255,255,255,.85);backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-xl);box-shadow:var(--sh-md);position:relative;overflow:hidden}
.panel::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.9) 0%,transparent 50%);pointer-events:none}

/* ── SIDEBAR ── */
.sidebar{width:268px;min-width:268px;display:flex;flex-direction:column;gap:.5rem;padding:1.25rem 1rem;position:sticky;top:1rem;max-height:calc(100svh - 2rem);overflow-y:auto}
@media(max-width:1023px){
  .sidebar{position:fixed;top:0;right:-280px;width:280px;min-width:0;height:100svh;max-height:none;border-radius:0 0 0 var(--r-xl);z-index:300;transition:right .3s cubic-bezier(.4,0,.2,1);padding:1.5rem 1rem}
  .sidebar.open{right:0;box-shadow:var(--sh-lg)}
}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:299;backdrop-filter:blur(2px)}
body.drawer-open .drawer-overlay{display:block}

.logo-box{display:flex;align-items:center;gap:.75rem;padding:.5rem .25rem 1rem;border-bottom:1px solid var(--border);margin-bottom:.5rem}
.logo-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--pink-d));display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:var(--sh-pink);flex-shrink:0}
.logo-text{font-family:'Lalezar',cursive;font-size:1.25rem;color:var(--brown);line-height:1}
.logo-sub{font-size:.7rem;color:var(--ink-f);font-weight:500}

.nav-section{font-size:.68rem;font-weight:700;color:var(--ink-f);letter-spacing:.6px;padding:.75rem .75rem .25rem;text-transform:uppercase}
.nav-link{display:flex;align-items:center;gap:.75rem;padding:.7rem .85rem;border-radius:var(--r-md);font-size:.88rem;font-weight:500;color:var(--ink-s);cursor:pointer;transition:all .2s;border:none;background:none;width:100%;text-align:right;position:relative}
.nav-link:hover{background:var(--pink-l);color:var(--pink-d)}
.nav-link.active{background:linear-gradient(135deg,var(--pink-l),rgba(124,58,237,.08));color:var(--pink-d);font-weight:700;box-shadow:0 4px 16px rgba(232,120,154,.15)}
.nav-link.active::before{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:2px;background:var(--pink-d)}
.nav-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;background:var(--surface);transition:all .2s;flex-shrink:0}
.nav-link.active .nav-ico{background:var(--pink);color:#fff;box-shadow:var(--sh-pink)}

.status-box{margin-top:auto;padding:.9rem;border-radius:var(--r-md);background:linear-gradient(135deg,var(--green-bg),rgba(16,185,129,.08));border:1px solid rgba(16,185,129,.2)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.5}}

/* ── MAIN ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1rem}

/* ── HEADER ── */
.header{display:flex;align-items:center;gap:.75rem;padding:.85rem 1.25rem}
.menu-btn{display:none;background:none;border:none;cursor:pointer;padding:.4rem;border-radius:10px;font-size:1.3rem;color:var(--ink-s);transition:background .2s}
.menu-btn:hover{background:var(--pink-l)}
@media(max-width:1023px){.menu-btn{display:flex;align-items:center;justify-content:center}}
.page-title-wrap{flex:1;min-width:0}
.page-title{font-size:1.2rem;font-weight:800;color:var(--ink);line-height:1.2}
.page-sub{font-size:.75rem;color:var(--ink-f);margin-top:1px}
.header-actions{display:flex;align-items:center;gap:.5rem}
.hbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--ink-s);transition:all .2s;position:relative}
.hbtn:hover{background:var(--pink-l);border-color:var(--pink-2);color:var(--pink-d)}
.notif-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--white)}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem}
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr}}
.stat-card{padding:1.1rem 1.25rem;display:flex;align-items:center;gap:1rem;cursor:default;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.stat-ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.stat-ico-pink{background:linear-gradient(135deg,var(--pink),var(--pink-d));box-shadow:var(--sh-pink)}
.stat-ico-green{background:linear-gradient(135deg,#34d399,var(--green));box-shadow:0 8px 24px rgba(16,185,129,.25)}
.stat-ico-blue{background:linear-gradient(135deg,#60a5fa,var(--blue));box-shadow:0 8px 24px rgba(37,99,235,.25)}
.stat-ico-purple{background:linear-gradient(135deg,#a78bfa,var(--purple));box-shadow:0 8px 24px rgba(124,58,237,.25)}
.stat-lbl{font-size:.73rem;color:var(--ink-f);font-weight:500}
.stat-val{font-size:1.65rem;font-weight:800;color:var(--ink);line-height:1.1;margin:.1rem 0}
.stat-trend{font-size:.72rem;font-weight:600;color:var(--green)}
.stat-trend.down{color:var(--red)}

/* ── SPARK ── */
.spark{width:100%;height:32px;margin-top:.5rem;overflow:visible}
.spark-line{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ── CONTENT AREA ── */
.content{flex:1}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1.1rem;flex-wrap:wrap}
.section-title{font-size:1rem;font-weight:700;color:var(--ink)}
.section-sub{font-size:.75rem;color:var(--ink-f);margin-top:1px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.1rem;border-radius:var(--r-sm);font-family:'Vazirmatn',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;box-shadow:var(--sh-pink)}
.btn-primary:hover{opacity:.88;transform:translateY(-1px)}
.btn-ghost{background:var(--white);border:1.5px solid var(--border);color:var(--ink-s)}
.btn-ghost:hover{border-color:var(--pink-2);background:var(--pink-l);color:var(--pink-d)}
.btn-danger{background:var(--red-bg);border:1.5px solid #fecaca;color:var(--red)}
.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:.4rem .8rem;font-size:.78rem}
.btn-icon-only{width:34px;height:34px;padding:0;border-radius:10px;justify-content:center}

/* ── SEARCH + FILTER ── */
.toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap input{width:100%;padding:.65rem 2.4rem .65rem 1rem;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:'Vazirmatn',sans-serif;font-size:.88rem;background:var(--white);outline:none;transition:border .2s;color:var(--ink)}
.search-wrap input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(232,120,154,.12)}
.search-icon{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);color:var(--ink-f);font-size:.95rem}
.filter-tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.ftab{padding:.45rem 1rem;border-radius:20px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-family:'Vazirmatn',sans-serif;font-size:.8rem;font-weight:600;color:var(--ink-f);transition:all .2s}
.ftab:hover,.ftab.on{border-color:var(--pink);color:var(--pink-d);background:var(--pink-l)}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:640px}
thead th{background:var(--pink-l);color:var(--pink-d);font-weight:700;padding:.85rem 1rem;text-align:right;border-bottom:2px solid var(--pink-2);font-size:.78rem;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--surface);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(252,232,239,.4)}
td{padding:.85rem 1rem;vertical-align:middle}
.col-id{font-weight:700;color:var(--pink-d);font-size:.78rem;font-family:monospace}
.col-name{font-weight:600;color:var(--ink)}
.col-sub{font-size:.76rem;color:var(--ink-f);margin-top:1px}

/* ── CHIPS / BADGES ── */
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .8rem;border-radius:20px;font-size:.75rem;font-weight:700;white-space:nowrap}
.chip-ok{background:var(--green-bg);color:#065f46;border:1px solid #a7f3d0}
.chip-wait{background:var(--yellow-bg);color:#92400e;border:1px solid #fde68a}
.chip-blue{background:var(--blue-bg);color:#1e40af;border:1px solid #bfdbfe}
.chip-purple{background:var(--purple-bg);color:#5b21b6;border:1px solid #ddd6fe}
.chip-fail{background:var(--red-bg);color:#991b1b;border:1px solid #fecaca}
.chip-cake{background:var(--pink-l);color:var(--pink-d);border:1px solid var(--pink-2)}
.chip-pastry{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.chip-clickable{cursor:pointer;transition:opacity .2s}
.chip-clickable:hover{opacity:.8}

/* ── ACTIONS ── */
.row-actions{display:flex;gap:.4rem}
.act-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.act-btn:hover{background:var(--pink-l);border-color:var(--pink-2)}
.act-btn.del:hover{background:var(--red-bg);border-color:#fecaca}

/* ── CARDS (courses) ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.course-card{padding:1.25rem;border-radius:var(--r-lg);background:var(--white);border:1.5px solid var(--border);transition:all .2s;cursor:default}
.course-card:hover{border-color:var(--pink-2);box-shadow:var(--sh-md);transform:translateY(-2px)}
.course-thumb{width:100%;height:140px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--pink-l),#f8e8ff);display:flex;align-items:center;justify-content:center;font-size:3rem;margin-bottom:1rem;overflow:hidden}
.course-title{font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:.35rem}
.course-desc{font-size:.8rem;color:var(--ink-s);line-height:1.55;margin-bottom:.75rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.course-meta{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.course-price{font-size:1rem;font-weight:800;color:var(--pink-d)}
.course-price .old{font-size:.75rem;color:var(--ink-f);text-decoration:line-through;font-weight:400;margin-right:.25rem}
.course-actions{display:flex;gap:.4rem;margin-top:.85rem;padding-top:.85rem;border-top:1px solid var(--surface)}

/* ── GALLERY ── */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem}
.gallery-item{border-radius:var(--r-sm);overflow:hidden;border:2px solid var(--border);aspect-ratio:1;background:var(--pink-l);display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative;cursor:pointer;transition:all .2s}
.gallery-item:hover{border-color:var(--pink);transform:scale(1.02)}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-del{position:absolute;top:.3rem;left:.3rem;background:rgba(239,68,68,.9);color:#fff;border:none;border-radius:6px;width:24px;height:24px;font-size:.7rem;cursor:pointer;display:none;align-items:center;justify-content:center}
.gallery-item:hover .gallery-del{display:flex}

/* ── FORM ── */
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--brown);margin-bottom:.4rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.65rem 1rem;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:'Vazirmatn',sans-serif;font-size:.88rem;color:var(--ink);background:var(--white);outline:none;transition:border .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(232,120,154,.1)}
.form-group textarea{resize:vertical;min-height:90px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:520px){.form-2col{grid-template-columns:1fr}}
.form-hint{font-size:.73rem;color:var(--ink-f);margin-top:.3rem}

/* ── MODAL ── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.modal-backdrop.open{display:flex}
.modal{background:var(--white);border-radius:var(--r-xl);width:560px;max-width:100%;max-height:90svh;overflow-y:auto;box-shadow:var(--sh-lg);animation:modal-in .25s ease-out}
@keyframes modal-in{from{opacity:0;transform:scale(.95) translateY(8px)}}
.modal-header{padding:1.25rem 1.5rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:1}
.modal-title{font-size:1.05rem;font-weight:800;color:var(--brown)}
.modal-close{background:var(--surface);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background .2s}
.modal-close:hover{background:var(--pink-l)}
.modal-body{padding:1.25rem 1.5rem}
.modal-footer{padding:1rem 1.5rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:.6rem;justify-content:flex-end}

/* ── DETAIL ROWS ── */
.d-row{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:1px dashed var(--border);font-size:.88rem;gap:1rem}
.d-row:last-child{border-bottom:none}
.d-label{color:var(--ink-f);flex-shrink:0}
.d-val{font-weight:600;color:var(--ink);text-align:left}
.stepper{display:flex;margin:1rem 0;direction:ltr;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.step{flex:1;text-align:center;padding:.5rem .3rem;font-size:.68rem;font-weight:600;color:var(--ink-f);background:var(--surface);border-right:1px solid var(--border);transition:all .2s}
.step:last-child{border-right:none}
.step.done{background:var(--green-bg);color:#065f46}
.step.cur{background:var(--pink-l);color:var(--pink-d)}
.step-icon{display:block;font-size:.95rem;margin-bottom:2px}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--ink-f)}
.empty-state .emoji{font-size:3rem;display:block;margin-bottom:.75rem}

/* ── TOAST ── */
#toast-stack{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none;min-width:220px}
.toast{background:var(--brown);color:#fff;padding:.7rem 1.4rem;border-radius:30px;font-size:.88rem;font-weight:600;animation:toast-in .3s ease-out;white-space:nowrap}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}}
@keyframes toast-out{to{opacity:0;transform:translateY(10px)}}

/* ── SETTINGS ── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid var(--surface)}
.toggle-row:last-child{border-bottom:none}
.toggle{position:relative;width:42px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-ui{position:absolute;inset:0;border-radius:12px;background:#ddd;transition:.2s;cursor:pointer}
.toggle-ui::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle input:checked+.toggle-ui{background:var(--pink)}
.toggle input:checked+.toggle-ui::before{right:auto;left:3px}

/* ── PAGE TRANSITIONS ── */
#page-root{animation:page-in .3s ease-out}
@keyframes page-in{from{opacity:0;transform:translateY(8px)}}
.anim-stagger>*{animation:stagger-in .4s ease-out backwards}
.anim-stagger>*:nth-child(1){animation-delay:.05s}
.anim-stagger>*:nth-child(2){animation-delay:.1s}
.anim-stagger>*:nth-child(3){animation-delay:.15s}
.anim-stagger>*:nth-child(4){animation-delay:.2s}
@keyframes stagger-in{from{opacity:0;transform:translateY(12px)}}

/* ── ANALYTICS BARS ── */
.bar-chart{display:flex;align-items:flex-end;gap:.5rem;height:120px;margin-top:1rem}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:.4rem}
.bar-fill{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(to top,var(--pink-d),var(--pink));animation:bar-grow .8s ease-out backwards;transform-origin:bottom}
@keyframes bar-grow{from{transform:scaleY(0)}}
.bar-label{font-size:.68rem;color:var(--ink-f);white-space:nowrap}
.progress-track{height:8px;background:var(--surface);border-radius:4px;overflow:hidden;margin-top:.3rem}
.progress-fill{height:100%;border-radius:4px;animation:prog-fill 1s ease-out backwards}
@keyframes prog-fill{from{width:0}}

/* ── PAGINATION ── */
.pagination{display:flex;gap:.4rem;justify-content:center;margin-top:1rem}
.pg-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-family:'Vazirmatn',sans-serif;font-size:.82rem;font-weight:600;color:var(--ink-f);transition:all .2s}
.pg-btn:hover,.pg-btn.on{background:var(--pink);border-color:var(--pink);color:#fff}

/* ── MINI STAT ── */
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-top:1rem}

  { id:'DC-1005', name:'مریم حسینی',     phone:'09331234000', type:'pastry', status:'done',    price:150000, date:'۱۴۰۳/۱۲/۲۸', desc:'باقلوا نیم کیلو' },
  { id:'DC-1006', name:'امیر رضایی',     phone:'09107778899', type:'cake',   status:'cancel',  price:500000, date:'—',            desc:'لغو شد، پیش‌پرداخت بازگشت داده شد' },
  { id:'DC-1007', name:'نگار صادقی',     phone:'09214445566', type:'cake',   status:'pending', price:320000, date:'۱۴۰۴/۰۴/۰۷', desc:'کیک تولد دخترونه تم تک‌شاخ' },
  { id:'DC-1008', name:'حسین کمالی',     phone:'09368889900', type:'pastry', status:'confirm', price:200000, date:'۱۴۰۴/۰۴/۰۴', desc:'شیرینی نخودچی ۰.۵ کیلو' },

let COURSES = ls('courses', [
  { id:'CR-01', icon:'🎂', title:'کیک‌پزی مقدماتی',       desc:'آموزش کامل پایه‌های کیک‌پزی حرفه‌ای از صفر تا صد برای مبتدیان', package:'آشنایی با ابزار\nپخت کیک اسفنجی پایه\nاصول فیلینگ‌گذاری\nخامه‌کشی مدرن', price:1200000, sale:890000, dur:'۸ جلسه', level:'مقدماتی', pub:1 },
  { id:'CR-02', icon:'🍰', title:'کیک‌پزی پیشرفته',       desc:'تکنیک‌های حرفه‌ای تزئین، فوندانت، ویفر و انواع رویه‌های کیک', package:'کار با فوندانت\nگل‌های شکری\nویفر پیپر\nنقاشی روی کیک', price:2500000, sale:1800000, dur:'۱۲ جلسه', level:'پیشرفته', pub:1 },
  { id:'CR-03', icon:'🥐', title:'شیرینی‌پزی سنتی',       desc:'آموزش شیرینی‌های اصیل ایرانی؛ باقلوا، نان برنجی، کلوچه و بیشتر', package:'باقلوا قزوین\nنان برنجی کرمانشاه\nکلوچه لاهیجان', price:980000, sale:0, dur:'۶ جلسه', level:'مقدماتی', pub:1 },
  { id:'CR-04', icon:'🧁', title:'کاپ‌کیک و مینی‌کیک',   desc:'آموزش طراحی و تزئین کاپ‌کیک برای مجالس و مهمانی‌ها', package:'کاپ‌کیک شکلاتی\nفراستینگ پنیر\nمینی‌کیک روسی', price:750000, sale:590000, dur:'۴ جلسه', level:'متوسط', pub:0 },

  {id:'G1', emoji:'🎂', label:'کیک تولد'}, {id:'G2', emoji:'🍰', label:'کیک عروسی'},
  {id:'G3', emoji:'🧁', label:'کاپ‌کیک'}, {id:'G4', emoji:'🥐', label:'شیرینی'},
  {id:'G5', emoji:'🎂', label:'کیک شکلاتی'}, {id:'G6', emoji:'🍮', label:'دسر'},
])

function saveAll() {
  ss('orders', ORDERS); ss('courses', COURSES)
  ss('customers', CUSTOMERS); ss('content', CONTENT); ss('gallery', GALLERY)
}

// Firebase Sync Functions
async function syncFromFirebase() {
  try {
    const qCourses = query(collection(db, "courses"));
    const snapCourses = await getDocs(qCourses);
    if (!snapCourses.empty) {
        COURSES = snapCourses.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    }

    const qOrders = query(collection(db, "orders"));
    const snapOrders = await getDocs(qOrders);
    if (!snapOrders.empty) {
        ORDERS = snapOrders.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        // Manual sort to avoid index issues
        ORDERS.sort((a,b) => (b.date || "").localeCompare(a.date || ""));
    }

    const qContent = query(collection(db, "content"));
    const snapContent = await getDocs(qContent);
    if (!snapContent.empty) {
        CONTENT = snapContent.docs.map(doc => ({ key: doc.id, ...doc.data() }));
    }

    const qGallery = query(collection(db, "gallery"));
    const snapGallery = await getDocs(qGallery);
    if (!snapGallery.empty) {
        GALLERY = snapGallery.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    }

    const qCustomers = query(collection(db, "customers"));
    const snapCustomers = await getDocs(qCustomers);
    if (!snapCustomers.empty) {
        CUSTOMERS = snapCustomers.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    }

    saveAll(); // Update local storage
    if(curPage) navigateTo(curPage);
    toast("همگام‌سازی با سرور انجام شد ✅", "success");
  } catch (e) {
    console.error("Firebase sync error:", e);
    toast("خطا در همگام‌سازی با سرور", "error");
  }
}

// Initial Sync
syncFromFirebase();

  gallery:   { title:'گالری تصاویر', sub:'مدیریت عکس‌های سایت و نمونه کارها' },
  customers: { title:'مشتریان', sub:'لیست و مدیریت مشتریان دل‌کیک' },
  analytics: { title:'گزارش‌ها', sub:'آمار فروش و عملکرد سایت' },
  content:   { title:'مدیریت محتوا', sub:'ویرایش متون، عناوین و اطلاعات سایت' },
  settings:  { title:'تنظیمات', sub:'پیکربندی پنل و پروفایل مدیر' },

function navigateTo(page) {
  if (!PAGE_META[page]) return
  curPage = page
  document.querySelectorAll('[data-nav]').forEach(n => n.classList.toggle('active', n.dataset.nav === page))
  document.getElementById('page-title').textContent = PAGE_META[page].title
  document.getElementById('page-sub').textContent   = PAGE_META[page].sub
  const root = document.getElementById('page-root')
  root.style.animation = 'none'; root.offsetHeight; root.style.animation = ''
  root.innerHTML = pages[page]()
  closeSidebar()
}

function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.body.classList.add('drawer-open') }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.body.classList.remove('drawer-open') }

document.querySelectorAll('[data-nav]').forEach(n => n.addEventListener('click', () => navigateTo(n.dataset.nav)))

// ═══════════════════════════════════════════
//  ORDERS CRUD
// ═══════════════════════════════════════════
function re() { navigateTo('orders') }

function openOrderModal(id) {
  const o = id ? ORDERS.find(x=>x.id===id) : null
  document.getElementById('mo-title').textContent = o ? 'ویرایش سفارش '+o.id : 'سفارش جدید'
  document.getElementById('mo-id').value    = o?.id||''
  document.getElementById('mo-name').value  = o?.name||''
  document.getElementById('mo-phone').value = o?.phone||''
  document.getElementById('mo-type').value  = o?.type||'cake'
  document.getElementById('mo-status').value= o?.status||'pending'
  document.getElementById('mo-price').value = o?.price||''
  document.getElementById('mo-date').value  = o?.date||''
  document.getElementById('mo-desc').value  = o?.desc||''
  openModal('modal-order')
}

async function saveOrder() {
  const id   = document.getElementById('mo-id').value
  const name = document.getElementById('mo-name').value.trim()
  const phone= document.getElementById('mo-phone').value.trim()
  if(!name||!phone){ toast('نام و شماره تلفن الزامی است','error'); return }
  const data = { name, phone,
    type:   document.getElementById('mo-type').value,
    status: document.getElementById('mo-status').value,
    price:  Number(document.getElementById('mo-price').value)||0,
    date:   document.getElementById('mo-date').value,
    desc:   document.getElementById('mo-desc').value,
  }
  try {
    if(id) {
      await setDoc(doc(db, "orders", id), data);
      Object.assign(ORDERS.find(x=>x.id===id), data);
      toast('سفارش ویرایش شد ✅','success')
    } else {
      const docRef = await addDoc(collection(db, "orders"), data);
      data.id = docRef.id;
      ORDERS.unshift(data);
      toast('سفارش جدید ثبت شد 🎂','success')
    }
    saveAll(); closeModal('modal-order'); re()
  } catch(e) { console.error(e); toast("خطا در ذخیره سازی", "error") }
}

async function cycleStatus(id) {
  const o = ORDERS.find(x=>x.id===id)
  if(!o || o.status==='cancel') return
  const i = STATUS_FLOW.indexOf(o.status)
  o.status = STATUS_FLOW[Math.min(i+1, STATUS_FLOW.length-1)]
  try {
    await setDoc(doc(db, "orders", id), o);
    saveAll(); toast('وضعیت به «'+STATUS[o.status].label+'» تغییر کرد'); re()
  } catch(e) { console.error(e); toast("خطا در بروزرسانی", "error") }
}

async function delOrder(id) {
  if(!confirm('این سفارش حذف شود؟')) return
  try {
    await deleteDoc(doc(db, "orders", id));
    ORDERS = ORDERS.filter(x=>x.id!==id); saveAll(); toast('سفارش حذف شد'); re()
  } catch(e) { console.error(e); toast("خطا در حذف", "error") }
}

function showOrderDetail(id) {
  const o = ORDERS.find(x=>x.id===id); if(!o) return
  const s = STATUS[o.status]
  const flow = STATUS_FLOW.map((st,i)=>{
    const cur = STATUS_FLOW.indexOf(o.status)
    return `<div class="step ${i<cur?'done':i===cur?'cur':''}">${STATUS[st].icon}<br/>${STATUS[st].label.split(' ')[0]}</div>`
  }).join('')
  document.getElementById('order-detail-body').innerHTML = `
    <div class="stepper">${flow}</div>
    ${[['شناسه',o.id],['نام مشتری',o.name],['تلفن',`<span dir="ltr">${o.phone}</span>`],
       ['نوع',o.type==='cake'?'🎂 کیک':'🥐 شیرینی'],['وضعیت',`${s.icon} ${s.label}`],
       ['تاریخ تحویل',o.date||'—'],['قیمت',Number(o.price).toLocaleString('fa-IR')+' تومان'],['توضیحات',o.desc||'—']
    ].map(([l,v])=>`<div class="d-row"><span class="d-label">${l}</span><span class="d-val">${v}</span></div>`).join('')}
  `
  openModal('modal-order-detail')
}

async function addGalleryItem() {
  const labels = ['کیک تولد','کیک عروسی','کاپ‌کیک','شیرینی','دسر','کیک شکلاتی','کیک تزئینی','سفارشی']
  const item = { emoji: EMOJIS[Math.floor(Math.random()*EMOJIS.length)], label: labels[Math.floor(Math.random()*labels.length)] }

    saveAll(); toast('تصویر اضافه شد 🖼️','success'); navigateTo('gallery')

// ═══════════════════════════════════════════
//  MODAL HELPERS
// ═══════════════════════════════════════════
function openModal(id)  { document.getElementById(id).classList.add('open') }
function closeModal(id) { document.getElementById(id).classList.remove('open') }
document.querySelectorAll('.modal-backdrop').forEach(el => el.addEventListener('click', e => { if(e.target===el) el.classList.remove('open') }))

// ═══════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════
function toast(msg, type='info') {
  const el = document.createElement('div')
  el.className = `toast ${type}`; el.textContent = msg
  document.getElementById('toast-stack').appendChild(el)
  setTimeout(()=>{ el.style.animation='toast-out .3s ease-out forwards'; setTimeout(()=>el.remove(),300) }, 2800)
}
