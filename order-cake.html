<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سفارش کیک | دل‌کیک</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap"
rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap"
rel="stylesheet">

</head>

<body>

<header class="top-header">

    <button class="menu-btn">
        <i class="fas fa-bars"></i>
    </button>

    <a href="index.html" class="site-logo-mini">
        <img src="images/logo/sweet-.png" alt="دل کیک">
    </a>

    <a href="academy.html" class="academy-btn">
        ثبت‌نام دوره
    </a>

</header>

<div id="sideMenu" class="side-menu">

    <div class="menu-profile">

        <img src="images/logo/sweet-.png" alt="دل کیک">

        <h3>دل‌کیک</h3>

        <p>
            شیرینی، آموزش و خلاقیت
        </p>

    </div>

    <a href="index.html">
        <i class="fas fa-house"></i>
        خانه
    </a>

    <a href="academy.html">
        <i class="fas fa-graduation-cap"></i>
        آکادمی دل‌کیک
    </a>

    <a href="order-cake.html">
        <i class="fas fa-cake-candles"></i>
        سفارش کیک
    </a>

    <a href="index.html#gallerySection">
        <i class="fas fa-image"></i>
        نمونه کارها
    </a>

    <a href="tel:09102768171">
        <i class="fas fa-phone"></i>
        تماس با ما
    </a>

</div>

<div class="order-page">

<section class="order-hero">

<h1>سفارش کیک اختصاصی</h1>

<p>
کیک رویایی خودت را طراحی کن و سفارش بده 💕
</p>

</section>

<section class="order-form">

<form>

<div class="form-group">

<label>نام و نام خانوادگی</label>

<input type="text"
placeholder="نام خود را وارد کنید">

</div>

<div class="form-group">

<label>شماره تماس</label>

<input type="tel"
placeholder="09xxxxxxxxx">

</div>

<div class="form-group">

<label>نوع کیک</label>

<select>

<option>کیک تولد</option>
<option>کیک نامزدی</option>
<option>کیک عروسی</option>
<option>کیک کودک</option>
<option>کیک سفارشی</option>

</select>

</div>

<div class="form-group">

<label>تعداد نفرات</label>

<select>

<option>5 تا 10 نفر</option>
<option>10 تا 20 نفر</option>
<option>20 تا 40 نفر</option>
<option>40 نفر به بالا</option>

</select>

</div>

<div class="form-group">

<label>تاریخ تحویل</label>

<input type="date">

</div>

<div class="form-group">

<label>توضیحات سفارش</label>

<textarea
rows="5"
placeholder="رنگ، طرح، شخصیت کارتونی یا هر توضیحی که دوست دارید..."></textarea>

</div>

<button type="submit" class="order-btn">

ثبت سفارش

</button>

</form>

</section>

</div>

<div id="menuOverlay" class="menu-overlay"></div>

<script src="script.js"></script>

</body>
</html>
