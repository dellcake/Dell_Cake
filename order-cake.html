<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سفارش کیک | دل‌کیک</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap"
rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap"
rel="stylesheet">

</head>

<body>

<header class="top-header">

    <button class="menu-btn">
        <i class="fas fa-bars"></i>
    </button>

    <a href="index.html" class="site-logo-mini">
        <img src="images/logo/sweet-.png" alt="دل کیک">
    </a>

    <a href="academy.html" class="academy-btn">
        ثبت‌نام دوره
    </a>

</header>

<div id="sideMenu" class="side-menu">

    <div class="menu-profile">

        <img src="images/logo/sweet-.png" alt="دل کیک">

        <h3>دل‌کیک</h3>

        <p>
            شیرینی، آموزش و خلاقیت
        </p>

    </div>

    <a href="index.html">
        <i class="fas fa-house"></i>
        خانه
    </a>

    <a href="academy.html">
        <i class="fas fa-graduation-cap"></i>
        آکادمی دل‌کیک
    </a>

    <a href="order-cake.html">
        <i class="fas fa-cake-candles"></i>
        سفارش کیک
    </a>

    <a href="index.html#gallerySection">
        <i class="fas fa-image"></i>
        نمونه کارها
    </a>

    <a href="tel:09102768171">
        <i class="fas fa-phone"></i>
        تماس با ما
    </a>

</div>

<div class="order-page">

<section class="order-hero">

<h1>سفارش کیک اختصاصی</h1>

<p>
کیک رویایی خودت را طراحی کن و سفارش بده 💕
</p>

</section>

<section class="order-form">

<form
id="orderForm"
enctype="multipart/form-data">

<div class="form-group">

<label for="customerName">نام و نام خانوادگی</label>

<input
id="customerName"
name="customerName"
type="text"
placeholder="نام خود را وارد کنید">

</div>

<div class="form-group">

<label for="customerPhone">شماره تماس</label>

<input
id="customerPhone"
name="customerPhone"
type="tel"
placeholder="09xxxxxxxxx">

</div>

<div class="form-group">

<label for="cakeType">نوع کیک</label>

<select
id="cakeType"
name="cakeType">

<option value="">انتخاب کنید</option>

<option value="birthday">کیک تولد</option>
<option value="engagement">کیک نامزدی</option>
<option value="wedding">کیک عروسی</option>
<option value="kids">کیک کودک</option>
<option value="custom">کیک سفارشی</option>

</select>

</div>


<input
id="birthdayName"
name="birthdayName"
type="text">

<input
id="birthdayAge"
name="birthdayAge"
type="number">

<input
id="birthdayColors"
name="birthdayColors"
type="text">

<input
id="birthdayText"
name="birthdayText"
type="text">

<input
type="file"
id="birthdayImage"
name="birthdayImage"
accept="image/*">

<div class="upload-box">

<label class="upload-label">

<i class="fas fa-camera"></i>

<span>انتخاب عکس نمونه یا ایده</span>

</label>

</div>


<input
id="kidName"
name="kidName"
type="text">

<input
id="kidAge"
name="kidAge"
type="number">

<input
id="kidCharacter"
name="kidCharacter"
type="text">

<input
id="kidColors"
name="kidColors"
type="text">

<input
type="file"
id="kidImage"
name="kidImage"
accept="image/*">
    

<input
id="coupleNames"
name="coupleNames"
type="text">

<input
id="engagementTheme"
name="engagementTheme"
type="text">

<input
id="engagementText"
name="engagementText"
type="text">

<input
type="file"
id="engagementImage"
name="engagementImage"
accept="image/*">


<select
id="weddingFloors"
name="weddingFloors">

<option value="1">1 طبقه</option>
<option value="2">2 طبقه</option>
<option value="3">3 طبقه</option>
<option value="4">4 طبقه</option>

</select>

<input
id="weddingTheme"
name="weddingTheme"
type="text">

<input
id="weddingColors"
name="weddingColors"
type="text">

<input
type="file"
id="weddingImage"
name="weddingImage"
accept="image/*">


<input
id="customTheme"
name="customTheme"
type="text">

<input
id="customColors"
name="customColors"
type="text">

<input
id="customText"
name="customText"
type="text">

<input
type="file"
id="customImage"
name="customImage"
accept="image/*">

<div class="form-group">

<label for="guestCount">تعداد نفرات</label>

<select
id="guestCount"
name="guestCount">

<option value="">انتخاب کنید</option>
<option value="5-10">5 تا 10 نفر</option>
<option value="10-20">10 تا 20 نفر</option>
<option value="20-40">20 تا 40 نفر</option>
<option value="40+">40 نفر به بالا</option>

</select>

</div>

<input
type="text"
id="deliveryDate"
name="deliveryDate"
placeholder="مثال: ۱۴۰۵/۰۳/۲۵">

<textarea
id="orderDescription"
name="orderDescription"
rows="5"
placeholder="رنگ، طرح، شخصیت کارتونی یا هر توضیحی که دوست دارید..."></textarea>

<button type="submit" class="order-btn">

ثبت سفارش

</button>

    <div id="successMessage" class="success-message">

🎂 سفارش شما با موفقیت ثبت شد

<br><br>

در اولین فرصت با شما تماس می‌گیریم 💕

    </div>

</form>

</section>

</div>

<div id="menuOverlay" class="menu-overlay"></div>

<script src="script.js"></script>

</body>
</html>
