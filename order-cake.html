<div class="order-page">

<section class="order-hero">

<h1>سفارش کیک اختصاصی</h1>

<p>
کیک رویایی خودت را طراحی کن و سفارش بده 💕
</p>

</section>

<section class="order-form">

<form>

<div class="form-group">

<label>نام و نام خانوادگی</label>

<input type="text"
placeholder="نام خود را وارد کنید">

</div>

<div class="form-group">

<label>شماره تماس</label>

<input type="tel"
placeholder="09xxxxxxxxx">

</div>

<div class="form-group">

<label>نوع کیک</label>

<select>

<option>کیک تولد</option>

<option>کیک نامزدی</option>

<option>کیک عروسی</option>

<option>کیک کودک</option>

<option>سفارشی</option>

</select>

</div>

<div class="form-group">

<label>تعداد نفرات</label>

<select>

<option>5 تا 10 نفر</option>

<option>10 تا 20 نفر</option>

<option>20 تا 40 نفر</option>

<option>40 نفر به بالا</option>

</select>

</div>

<div class="form-group">

<label>تاریخ تحویل</label>

<input type="date">

</div>

<div class="form-group">

<label>توضیحات سفارش</label>

<textarea
rows="5"
placeholder="رنگ، طرح، شخصیت کارتونی یا هر توضیحی که دوست دارید..."></textarea>

</div>

<button type="submit" class="order-btn">

ثبت سفارش

</button>

</form>

</section>

</div>
