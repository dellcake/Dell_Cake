<div class="dellcake-form">

  <div class="header">
    <h1>فرم سفارش شیرینی</h1>
    <p>دل‌کیک | طعم شیرین لحظه‌ها 🍰</p>
  </div>

  <form>

    <!-- اطلاعات مشتری -->
    <fieldset>
      <legend>🧁 اطلاعات مشتری</legend>

      <div class="grid">
        <input placeholder="نام و نام خانوادگی" />
        <input placeholder="شماره تماس" />
        <input placeholder="آیدی اینستاگرام (اختیاری)" />
        <input type="date" />
      </div>
    </fieldset>

    <!-- نوع شیرینی -->
    <fieldset>
      <legend>🍪 نوع شیرینی</legend>

      <label><input type="checkbox"> شیرینی خشک</label>
      <label><input type="checkbox"> شیرینی تر</label>
      <label><input type="checkbox"> کوکی</label>
      <label><input type="checkbox"> ماکارون</label>
      <label><input type="checkbox"> مناسبتی</label>

      <input placeholder="سایر..." />
    </fieldset>

    <!-- طراحی -->
    <fieldset>
      <legend>🎨 طراحی و ظاهر</legend>

      <input placeholder="تم رنگی مورد نظر" />

      <select>
        <option>سبک طراحی</option>
        <option>فانتزی و کارتونی</option>
        <option>مینیمال</option>
        <option>لوکس و شیک</option>
        <option>مناسبتی</option>
      </select>

      <textarea placeholder="توضیحات ظاهری دلخواه..."></textarea>
    </fieldset>

    <!-- طعم -->
    <fieldset>
      <legend>🍫 طعم و مواد اولیه</legend>

      <label><input type="checkbox"> وانیلی</label>
      <label><input type="checkbox"> شکلاتی</label>
      <label><input type="checkbox"> زعفرانی</label>
      <label><input type="checkbox"> دارچینی</label>

      <input placeholder="ترکیبی (در صورت نیاز)" />
      <input placeholder="حساسیت غذایی (در صورت وجود)" />
    </fieldset>

    <!-- بسته بندی -->
    <fieldset>
      <legend>📦 تعداد و بسته‌بندی</legend>

      <input placeholder="تعداد تقریبی" />

      <select>
        <option>نوع بسته‌بندی</option>
        <option>ساده</option>
        <option>کادویی</option>
        <option>لوکس دل‌کیک</option>
      </select>

      <input placeholder="متن روی بسته (اختیاری)" />
    </fieldset>

    <!-- تحویل -->
    <fieldset>
      <legend>🚚 تحویل سفارش</legend>

      <input type="date" placeholder="تاریخ تحویل" />

      <select>
        <option>روش تحویل</option>
        <option>حضوری</option>
        <option>پیک</option>
      </select>

      <input placeholder="آدرس (در صورت ارسال)" />
    </fieldset>

    <!-- توضیحات -->
    <fieldset>
      <legend>✨ توضیحات اضافه</legend>
      <textarea placeholder="هر توضیحی که لازم است..."></textarea>
    </fieldset>

    <button type="submit">ثبت سفارش 🍓</button>

  </form>
</div>
